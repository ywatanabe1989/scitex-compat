[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scitex-compat"
version = "0.1.8"
description = "Backward compatibility shims and deprecation wrappers"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
authors = [
    { name = "Yusuke Watanabe", email = "ywatanabe@scitex.ai" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
# Bare install is the full package; [all] is provided for ecosystem-wide
# consistency so `pip install scitex-*[all]` works uniformly.
all = []

dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "scitex-dev>=0.11.7",
]

docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]

[project.entry-points."scitex_dev.docs"]
scitex-compat = "scitex_compat"

[project.entry-points."scitex_dev.skills"]
scitex-compat = "scitex_compat"

[project.urls]
Homepage = "https://github.com/ywatanabe1989/scitex-compat"
Repository = "https://github.com/ywatanabe1989/scitex-compat.git"
Issues = "https://github.com/ywatanabe1989/scitex-compat/issues"
Documentation = "https://scitex-compat.readthedocs.io"

[tool.hatch.build.targets.wheel]
packages = ["src/scitex_compat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
parallel = true
source = ["scitex_compat"]
concurrency = ["multiprocessing", "thread"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.scitex-linter]
library_dirs = ["src", "tests", "examples"]

[tool.scitex_dev.audit]
# PS-168 — Per-package secret + env-var prefix in GitHub Actions workflows.
# `GH_PERSONAL_ACCESS_TOKEN` is the ecosystem-wide cross-cutting PAT used
# by the contributor-assistant CLA action. The natural GITHUB_* namespace
# is reserved by GitHub Actions on the secret-name surface (HTTP 422 on
# every `gh secret set`), so the GH_ shorthand is the canonical
# substitute and is registered ecosystem-wide via PR #122 on scitex-dev
# (EXCEPTION_SECRETS_DEFAULT). This per-package entry pins the same
# exception inline so the audit passes on every scitex-dev version,
# independent of release timing.
ps168_secret_exceptions = ["GH_PERSONAL_ACCESS_TOKEN"]
