name: CLA Assistant

# PILOT: org-level reusable-workflow caller (scitex-ai/.github, 2026-07-10).
# Triggers/permissions preserved verbatim from the prior local file.
# Reusable workflow defaults are owner_login=ywatanabe1989,
# owner_allowlist="bot*,ywatanabe1989", default_branch=main. This repo's
# prior allowlist additionally included "LLEmacs", so that is passed as a
# `with:` override below; default_branch (main) and owner_login
# (ywatanabe1989) already match the defaults, so no override needed there.
# There is no push trigger here (issue_comment + pull_request_target only),
# so the reusable workflow's push-triggered owner-bypass job simply never
# fires — same behavior as before (this repo never had that job either).

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  call:
    uses: scitex-ai/.github/.github/workflows/cla.yml@main
    with:
      owner_allowlist: "bot*,ywatanabe1989,LLEmacs"
    secrets: inherit